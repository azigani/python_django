<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' https://cdn.jsdelivr.net; script-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; font-src 'self' https://cdn.jsdelivr.net;">
    {% block extra_head %}{% endblock %}
    <title>{% block title %}Gestion Commerciale{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" {% if csp_nonce %}nonce="{{ csp_nonce }}"{% endif %}>
    <style {% if csp_nonce %}nonce="{{ csp_nonce }}"{% endif %}>
        body { background-color: #F5F5F5; }
        .navbar { background-color: #003366; }
        .navbar-brand, .nav-link { color: #FFD600 !important; font-weight: 600; }
        .navbar-nav .nav-link.active, .navbar-nav .nav-link:hover { color: #003366 !important; background-color: #FFD600; border-radius: 4px; }
        .container { max-width: 1000px; }
        h2, h5 { color: #003366; }
        .btn-primary { background-color: #003366; border-color: #003366; }
        .btn-primary:hover { background-color: #FFD600; color: #003366; border-color: #FFD600; }
        .btn-warning { background-color: #FFD600; color: #003366; border-color: #FFD600; }
        .btn-warning:hover { background-color: #003366; color: #FFD600; border-color: #003366; }
        .table-striped>tbody>tr:nth-of-type(odd) { background-color: #FFD6001A; }
        .table thead { background-color: #003366; color: #FFD600; }
        .card { border: 1px solid #003366; }
        .card-title { color: #003366; }
        .btn-danger { background-color: #C82333; border-color: #C82333; }
        .btn-danger:hover { background-color: #FFD600; color: #C82333; border-color: #FFD600; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Gestion Commerciale</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="/roles/">Rôles</a></li>
                    <li class="nav-item"><a class="nav-link" href="/taxes/">Taxes</a></li>
                    <!-- Ajoutez d'autres liens ici -->
                </ul>
            </div>
        </div>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" {% if csp_nonce %}nonce="{{ csp_nonce }}"{% endif %}></script>
</body>
</html>
