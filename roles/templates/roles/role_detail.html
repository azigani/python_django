{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <h2>Détail du rôle</h2>
    <div class="card mb-3">
        <div class="card-body">
            <h5 class="card-title">Nom : {{ role.name }}</h5>
            <p class="card-text">Description : {{ role.description }}</p>
        </div>
    </div>
    <a href="{% url 'role_update' role.pk %}" class="btn btn-warning">Modifier</a>
    <a href="{% url 'role_delete' role.pk %}" class="btn btn-danger">Supprimer</a>
    <a href="{% url 'role_list' %}" class="btn btn-secondary">Retour à la liste</a>
</div>
{% endblock %}
