{% extends 'base.html' %}
{% block extra_head %}{% if csp_nonce %}<meta name="csp-nonce" content="{{ csp_nonce }}">{% endif %}{% endblock %}
{% block content %}
<div class="container mt-4">
    <h2>Supprimer le rôle</h2>
    <p>Êtes-vous sûr de vouloir supprimer le rôle <strong>{{ role.name }}</strong> ?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Oui, supprimer</button>
        <a href="{% url 'role_list' %}" class="btn btn-secondary">Annuler</a>
    </form>
</div>
{% endblock %}
