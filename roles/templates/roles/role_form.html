{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <h2>{% if form.instance.pk %}Modifier le rôle{% else %}Ajouter un rôle{% endif %}</h2>
    <form method="post" class="needs-validation" novalidate>
        {% csrf_token %}
        <div class="mb-3">
            {{ form.as_p }}
        </div>
        <button type="submit" class="btn btn-success">Enregistrer</button>
        <a href="{% url 'role_list' %}" class="btn btn-secondary">Annuler</a>
    </form>
</div>
{% endblock %}
